# Registro central de datasets de detección de texto generado por IA.
#
# Para añadir un dataset nuevo: escribir un loader en src/aitext/datasets/<nombre>.py
# que devuelva un DataFrame con columnas ["text", "label"] (label=1 humano, 0 IA) y
# registrarlo aquí + en src/aitext/datasets/registry.py. Todas las estrategias/modelos/
# clasificadores ya existentes funcionan automáticamente con el dataset nuevo.

mage:
  loader: mage
  hf_id: yaful/MAGE
  split: test
  role: "MAGE (paper Table 2 / referencia [22])"

raid:
  loader: raid
  split: train
  role: "RAID, vía el paquete raid.utils.load_data (paper Table 3 / referencia [16])"

deepfaketextdetect:
  loader: deepfaketextdetect
  hf_id: artem9k/ai-text-detection-pile
  split: train
  role: "DeepfakeTextDetect / ATDP (paper Table 4 / referencia [23])"

beemo:
  loader: beemo
  hf_id: toloka/beemo
  split: train
  role: >
    Beemo (petición del revisor, paper referencia [27]). Tabla ancha: se usan
    human_output (humano) y model_output (IA) de las 2.187 filas; variantes editadas
    (human_edits, llama-3.1-70b_edits, gpt-4o_edits) no se usan -- son texto de IA
    editado, no una clase limpia. Pool natural ~2.187/2.187 -- confirmar con
    value_counts() antes de fijar n_total en el experimento.

m4gt_bench:
  loader: m4gt_bench
  hf_id: "d0rj/SemEval2024-task8 (config: subtaskA_monolingual)"
  split: train
  role: >
    M4GT-Bench (petición del revisor, paper referencia [26]), vía mirror comunitario
    -- el repo oficial mbzuai-nlp/M4GT-Bench solo distribuye por Google Drive/gdown.
    Alcance reducido a solo inglés (subtaskA_monolingual, NO subtaskA_multilingual)
    para mantener consistencia con el resto del pipeline (tokenizers, PAWN y el
    prompt zero-shot son todos de inglés) -- ver NOTES.md. OJO: la convención de
    labels en origen está invertida (0=humano, 1=máquina); el loader la voltea.
