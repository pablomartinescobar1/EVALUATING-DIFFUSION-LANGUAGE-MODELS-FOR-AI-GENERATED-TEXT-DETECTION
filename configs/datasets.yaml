# Central registry of AI-generated text detection datasets.
#
# To add a new dataset: write a loader in src/aitext/datasets/<name>.py that
# returns a DataFrame with columns ["text", "label"] (label=1 human, 0 AI) and
# register it here + in src/aitext/datasets/registry.py. Every existing
# strategy/model/classifier automatically works with the new dataset.

mage:
  loader: mage
  hf_id: yaful/MAGE
  split: test
  role: "MAGE (paper Table 2 / reference [22])"

raid:
  loader: raid
  split: train
  role: "RAID, via the raid.utils.load_data package (paper Table 3 / reference [16])"

deepfaketextdetect:
  loader: deepfaketextdetect
  hf_id: artem9k/ai-text-detection-pile
  split: train
  role: "DeepfakeTextDetect / ATDP (paper Table 4 / reference [23])"

beemo:
  loader: beemo
  hf_id: toloka/beemo
  split: train
  role: >
    Beemo (advisor's request, paper reference [27]). Wide table: human_output
    (human) and model_output (AI) are used out of the 2,187 rows; edited variants
    (human_edits, llama-3.1-70b_edits, gpt-4o_edits) are not used -- they are
    edited AI text, not a clean class. Natural pool ~2,187/2,187 -- confirm with
    value_counts() before fixing n_total in the experiment.

m4gt_bench:
  loader: m4gt_bench
  hf_id: "d0rj/SemEval2024-task8 (config: subtaskA_monolingual)"
  split: train
  role: >
    M4GT-Bench (advisor's request, paper reference [26]), via a community mirror --
    the official mbzuai-nlp/M4GT-Bench repo only distributes via Google Drive/gdown.
    Scope narrowed to English only (subtaskA_monolingual, NOT
    subtaskA_multilingual) to stay consistent with the rest of the pipeline
    (tokenizers, PAWN, and the zero-shot prompt are all English) -- see NOTES.md.
    NOTE: the source label convention is inverted (0=human, 1=machine); the loader
    flips it.
