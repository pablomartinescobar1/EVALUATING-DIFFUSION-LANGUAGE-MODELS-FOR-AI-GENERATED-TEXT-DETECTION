# Generates the paper's Beemo table (advisor's request).
#
# n_total is PROVISIONAL: Beemo's natural pool is ~2,187 human / ~2,187 AI (see
# configs/datasets.yaml). Before the full run, verify the real value_counts() --
# if clean_text_column() drops rows asymmetrically, balanced_sample() will raise
# loudly reporting the real achievable maximum; adjust n_total to
# 2 * min(human, AI) if it differs from 4374.
name: beemo
dataset: beemo
n_total: 4374
seed: 41
max_length: 512
batch_size: 4

models: [llada_8b_base, gpt2, llama2_7b, llama3_1_8b, gpt3_proxy, bert, roberta, modernbert]

strategies:
  score:
    classifiers: [logreg, random_forest, xgboost, xgboost_calibrated]
  pawn:
    classifiers: [logreg, deep_mlp]
  embedding:
    classifiers: [logreg]
  zero_shot:
    classifiers: [prompt]

output: results/tables/beemo.csv
