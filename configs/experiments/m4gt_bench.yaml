# Generates the paper's M4GT-Bench table (advisor's request).
#
# n_total is PROVISIONAL: subtaskA_monolingual's "train" split has ~120,000 rows
# (see configs/datasets.yaml), so 10,000 balanced should have plenty of headroom,
# but the real human/machine value_counts() hasn't been verified. Adjust n_total
# if balanced_sample() raises reporting fewer rows available.
name: m4gt_bench
dataset: m4gt_bench
n_total: 10000
seed: 41
max_length: 512
batch_size: 4

models: [llada_8b_base, gpt2, llama2_7b, llama3_1_8b, gpt3_proxy, bert, roberta, modernbert]

strategies:
  score:
    classifiers: [logreg, random_forest, xgboost, xgboost_calibrated]
  pawn:
    classifiers: [logreg, deep_mlp]
  embedding:
    classifiers: [logreg]
  zero_shot:
    classifiers: [prompt]

output: results/tables/m4gt_bench.csv
