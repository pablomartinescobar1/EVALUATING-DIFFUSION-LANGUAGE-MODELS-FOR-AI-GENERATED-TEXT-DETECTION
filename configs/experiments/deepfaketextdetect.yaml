# Genera la Tabla 4 del paper.
name: deepfaketextdetect
dataset: deepfaketextdetect
n_total: 10000
seed: 41
max_length: 512
batch_size: 4

models: [llada_8b_base, gpt2, llama7b, gpt3_proxy, bert, roberta]

strategies:
  score:
    classifiers: [logreg, random_forest, xgboost, xgboost_calibrated]
  pawn:
    classifiers: [logreg, deep_mlp]
  embedding:
    classifiers: [logreg]

output: results/tables/deepfaketextdetect.csv
