# Generates the paper's Table 5 (the "parameter-controlled" analysis).
#
# NOTE: llada_8b_base and llada_8b_vrpo are BOTH 8B-parameter models (see the note
# in configs/models.yaml about GSAI-ML/LLaDA-1.5). This is no longer a
# "small-scale" diffusion comparison -- it's two 8B variants against
# Dream-LLaDA-7B. Section 5.2 and Table 5 of the paper need to be rewritten
# accordingly.
#
# Unlike the original notebook (FinalResultsLLADAs.ipynb), which only ran on MAGE
# with 1,000 samples, this experiment covers all 3 datasets at 10,000 balanced
# samples, matching the main experiments.
name: llada_family
datasets: [mage, raid, deepfaketextdetect]
n_total: 10000
seed: 41
max_length: 512
batch_size: 4

models: [llada_8b_base, llada_8b_vrpo, dream_llada_7b]

strategies:
  score:
    classifiers: [logreg, random_forest, xgboost, xgboost_calibrated]
  pawn:
    classifiers: [logreg, deep_mlp]
  embedding:
    classifiers: [logreg]
  zero_shot:
    classifiers: [prompt]

output: results/tables/llada_family.csv
