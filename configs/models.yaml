# Central registry of models evaluated as detection backbones.
#
# To add a NEW model of an already-supported paradigm (autoregressive / masked_lm /
# diffusion), just add an entry here -- no .py file needs to change. Only a
# genuinely new paradigm (e.g. a model from another family) requires a new class in
# src/aitext/models/.
#
# Fields:
#   paradigm : autoregressive | masked_lm | diffusion
#   hf_id    : checkpoint identifier on Hugging Face
#   params   : approximate parameter count (for the paper's tables, not used in code)
#   role     : how this model is named/described in the paper (documents proxies/versions)
#   quantize_4bit : whether it's loaded with BitsAndBytesConfig(load_in_4bit=True)
#   pawn     : PAWN-extraction-specific hyperparameters (diffusion only: mask_ratio, num_samples)
#   quirks   : implementation notes (e.g. models that don't accept a 2D attention_mask)

gpt2:
  paradigm: autoregressive
  hf_id: gpt2-large
  params: "774M"
  role: "GPT-2 (paper Table 1)"
  quantize_4bit: false

gpt3_proxy:
  paradigm: autoregressive
  hf_id: EleutherAI/gpt-neo-2.7B
  params: "2.7B"
  role: >
    Open proxy for "GPT-3-medium". Not real GPT-3: the OpenAI API doesn't expose the
    full-vocabulary log-probs Score/PAWN need. See NOTES.md.
  quantize_4bit: true

llama2_7b:                # formerly "llama7b" -- see NOTES.md #7 and the post-advisor-review section
  paradigm: autoregressive
  hf_id: NousResearch/Llama-2-7b-hf
  params: "7B"
  role: >
    The paper used to call it "LLaMA-7B" but the real checkpoint always was
    LLaMA-2-7B, not LLaMA-1 (NOTES.md #7). Key renamed from "llama7b" to "llama2_7b"
    when llama3_1_8b was added, so the version is clear in the tables without having
    to open this file.
  quantize_4bit: true

llama3_1_8b:
  paradigm: autoregressive
  hf_id: meta-llama/Llama-3.1-8B
  params: "8B"
  role: >
    Second modern autoregressive LLM (advisor's request: "at least one more modern
    LLM"). BASE checkpoint (not -Instruct), same as the rest of the registry. GATED
    repo on HuggingFace: the HF account needs to have accepted Meta's license AND the
    GPU machine needs to be authenticated (huggingface-cli login or HF_TOKEN) before
    from_pretrained -- not a code problem.
  quantize_4bit: true

bert:
  paradigm: masked_lm
  hf_id: bert-base-uncased
  params: "110M"
  role: "BERT-base"
  quantize_4bit: false

roberta:
  paradigm: masked_lm
  hf_id: roberta-base
  params: "125M"
  role: "RoBERTa-base"
  quantize_4bit: false

modernbert:
  paradigm: masked_lm
  hf_id: answerdotai/ModernBERT-base
  params: "149M"
  role: >
    Added (advisor's request) so the "small model" comparison isn't exclusively
    2018-2023 encoders (BERT/RoBERTa) against 2025 diffusion. Requires
    transformers>=4.48 (ModernBERT support). Needs no new code:
    AutoModelForMaskedLM loads it the same way as BERT/RoBERTa.
  quantize_4bit: false

llada_8b_base:
  paradigm: diffusion
  hf_id: GSAI-ML/LLaDA-8B-Base
  params: "8B"
  role: "LLaDA-8B (paper Table 1)"
  quantize_4bit: true
  pawn:
    mask_ratio: 0.35
    num_samples: 10

llada_8b_vrpo:
  paradigm: diffusion
  hf_id: GSAI-ML/LLaDA-1.5
  params: "8B"
  role: >
    PREVIOUSLY labeled "LLaDA-1.5B" as if it were a ~1.5B-parameter model -- the
    model card on HF confirms "LLaDA 1.5" is a VRPO refinement of
    LLaDA-8B-Instruct, i.e. 8B real parameters, not a small model. There is
    currently no small-scale LLaDA checkpoint in this registry. See NOTES.md --
    Section 5.2 / Table 5 of the paper needs to be rewritten to reflect this: these
    are two 8B variants (Base vs VRPO) against Dream-LLaDA-7B, not a "small-scale"
    diffusion comparison.
  quantize_4bit: true
  pawn:
    mask_ratio: 0.35
    num_samples: 10

dream_llada_7b:
  paradigm: diffusion
  hf_id: Dream-org/Dream-v0-Base-7B
  params: "7B"
  role: "Dream-LLaDA-7B"
  quantize_4bit: true
  accepts_2d_attention_mask: false
  quirks: "Doesn't accept a 2D attention_mask; only input_ids is passed to the forward call."
  pawn:
    mask_ratio: 0.35
    num_samples: 10
