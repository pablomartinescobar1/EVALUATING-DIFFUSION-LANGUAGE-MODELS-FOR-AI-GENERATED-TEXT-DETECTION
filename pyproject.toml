[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitext"
version = "0.1.0"
description = "Detección de texto generado por IA con backbones autorregresivos, MLM y de difusión (LLaDA/Dream-LLaDA)."
requires-python = ">=3.10"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
